<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinyl Music Player</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="player" id="player">

  <section class="deck">
    <div class="vinyl" id="vinyl">
      <div class="label"></div>
    </div>
    <div class="arm" id="arm"></div>
  </section>

  <section class="info">
    <h1 id="title">Song title</h1>
    <p id="artist">Artist</p>
  </section>

  <section class="timeline">
    <span id="currentTime">0:00</span>
    <div class="progress" id="progress">
      <div class="bar" id="bar"></div>
    </div>
    <span id="duration">0:00</span>
  </section>

  <section class="controls">
    <button id="autoplayBtn" class="small active" title="Autoplay on/off">AUTO</button>
    <button id="prevBtn" aria-label="Previous">⏮</button>
    <button id="playBtn" class="play" aria-label="Play">▶</button>
    <button id="nextBtn" aria-label="Next">⏭</button>
    <div class="volume">
      <span>🔊</span>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
    </div>
  </section>

  <section class="playlist">
    <h2>Playlist</h2>
    <ul id="playlistList"></ul>
  </section>

  <audio id="audio" preload="metadata"></audio>
</main>

<script src="script.js"></script>
</body>
</html>
